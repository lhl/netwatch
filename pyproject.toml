[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprotect"
version = "0.1.0"
description = "Local security-advisory triage and policy-authorized remediation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
autoprotect = "autoprotect.cli:main"

[tool.setuptools]
packages = ["autoprotect"]
