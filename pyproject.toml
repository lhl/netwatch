[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autoprotect"
version = "0.2.0"
description = "Small local vulnerability and update tracker for machines and environments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
autoprotect = "autoprotect.cli:main"

[tool.setuptools]
packages = ["autoprotect"]
